name: ts-starter-courier-simulator
services:
  steadfast:
    image: wiremock/wiremock:3.13.2@sha256:0d4ecb3e4dc8213fd7a4d37d6a78f6e6b553a6d2e15bd51b0999781282ac61b3
    ports:
      - "127.0.0.1:9099:8080"
    volumes:
      - ./mappings:/home/wiremock/mappings:ro
    command: ["--disable-gzip", "--max-request-journal-entries", "10000"]
    networks: [simulator]
    restart: "no"
networks:
  simulator:
    driver: bridge
