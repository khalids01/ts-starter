# PostgreSQL/Redis are provisioned separately per shop in Dokploy.
services:
  web:
    image: khalids01/ecommerce-shops:web-${BRAND:?Set BRAND}-${IMAGE_TAG:?Set IMAGE_TAG}
    pull_policy: always
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3001"
      BRAND: ${BRAND:?Set BRAND}
      VITE_SERVER_URL: ${VITE_SERVER_URL:?Set VITE_SERVER_URL}
      VITE_ENABLE_POLAR: ${VITE_ENABLE_POLAR:-false}
      VITE_OWNER_SETUP_CHECK: ${VITE_OWNER_SETUP_CHECK:-false}
      AUTH_SESSION_COOKIE_NAME: ${AUTH_SESSION_COOKIE_NAME:-better-auth.session_token}
    expose:
      - "3001"
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://127.0.0.1:3001/'); process.exit(r.ok ? 0 : 1)"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    stop_grace_period: 35s

  api:
    image: khalids01/ecommerce-shops:api-${BRAND:?Set BRAND}-${IMAGE_TAG:?Set IMAGE_TAG}
    pull_policy: always
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      E2E_MODE: "false"
      HOST: 0.0.0.0
      PORT: "3000"
    expose:
      - "3000"
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD", "bun", "-e", "const r = await fetch('http://127.0.0.1:3000/health/live'); process.exit(r.ok ? 0 : 1)"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    stop_grace_period: 35s

networks:
  dokploy-network:
    external: true
