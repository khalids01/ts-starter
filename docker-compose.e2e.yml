services:
  postgres-e2e:
    image: postgres:17-alpine
    container_name: ts-starter-e2e-postgres
    environment:
      POSTGRES_USER: e2e
      POSTGRES_PASSWORD: e2e-local-only
      POSTGRES_DB: ts_starter_e2e
    ports:
      - "5433:5432"
    volumes:
      - ts_starter_e2e_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U e2e -d ts_starter_e2e"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-e2e:
    image: redis:7-alpine
    container_name: ts-starter-e2e-redis
    ports:
      - "6380:6379"
    volumes:
      - ts_starter_e2e_redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ts_starter_e2e_postgres_data:
  ts_starter_e2e_redis_data:
