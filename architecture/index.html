<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ts-starter Architecture Hub</title>
    <style>
      :root { color-scheme: dark; --bg:#0a0f1d; --panel:#10182a; --panel-2:#17213a; --text:#e7edf9; --muted:#96a5c0; --line:#283653; --accent:#4fd1c5; }
      :root[data-theme="light"] { color-scheme: light; --bg:#f5f7fb; --panel:#fff; --panel-2:#edf2fa; --text:#17213a; --muted:#60708b; --line:#d7dfed; --accent:#087f78; }
      * { box-sizing: border-box; }
      body { margin: 0; height: 100vh; overflow: hidden; background: var(--bg); color: var(--text); font: 14px/1.45 Inter, ui-sans-serif, system-ui, sans-serif; }
      .app { display: grid; grid-template-columns: 280px minmax(0, 1fr); height: 100vh; transition: grid-template-columns .18s ease; }
      .app.collapsed { grid-template-columns: 0 minmax(0, 1fr); }
      aside { overflow-y: auto; overflow-x: hidden; background: var(--panel); border-right: 1px solid var(--line); padding: 16px; white-space: nowrap; }
      .sidebar-tools { display: flex; justify-content: flex-end; gap: 8px; margin-bottom: 18px; }
      .brand { font-weight: 750; font-size: 16px; letter-spacing: -.02em; }
      .brand span { color: var(--accent); }
      .intro { color: var(--muted); margin: 8px 0 24px; white-space: normal; }
      .section { color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .08em; margin: 18px 10px 7px; text-transform: uppercase; }
      button { font: inherit; cursor: pointer; }
      .nav-item { display: block; width: 100%; border: 0; border-radius: 8px; background: transparent; color: var(--text); padding: 10px; text-align: left; }
      .nav-item:hover, .nav-item.active { background: var(--panel-2); }
      .nav-item small { display: block; color: var(--muted); margin-top: 2px; }
      main { position: relative; min-width: 0; overflow: hidden; }
      .icon { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--text); padding: 7px 10px; }
      .viewer { height: 100%; padding: 16px; }
      iframe { display: block; width: 100%; height: 100%; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); }
      #sidebar-open { display: none; position: absolute; z-index: 2; top: 16px; left: 16px; }
      .app.collapsed #sidebar-open { display: block; }
      @media (max-width: 760px) {
        .app { grid-template-columns: 0 minmax(0, 1fr); }
        aside { position: fixed; z-index: 10; width: 280px; height: 100vh; transform: translateX(-100%); transition: transform .18s ease; }
        .app.menu-open aside { transform: translateX(0); box-shadow: 18px 0 50px #0005; }
        .viewer { padding: 8px; }
        #sidebar-open { display: block; top: 8px; left: 8px; }
      }
    </style>
  </head>
  <body>
    <div class="app" id="app">
      <aside>
        <div class="sidebar-tools">
          <button class="icon" id="sidebar-close" aria-label="Hide navigation">‹</button>
          <button class="icon" id="theme-toggle" aria-label="Toggle theme">◐ Theme</button>
        </div>
        <div class="brand">ts-starter <span>architecture</span></div>
        <p class="intro">A guided map of the ecommerce and RBAC system.</p>
        <div class="section">System maps</div>
        <button class="nav-item active" data-page="component/ecommerce-system.html">System architecture<small>Components and boundaries</small></button>
        <button class="nav-item" data-page="security/rbac-authorization.html">RBAC authorization<small>Roles, permissions, guards</small></button>
        <div class="section">Operational views</div>
        <button class="nav-item" data-page="workflow/product-management.html">Product workflow<small>Admin write path</small></button>
        <button class="nav-item" data-page="sequence/storefront-checkout.html">Checkout sequence<small>Shop request path</small></button>
        <button class="nav-item" data-page="dataflow/product-inventory.html">Product data flow<small>Data lineage</small></button>
        <button class="nav-item" data-page="lifecycle/product-stock-order.html">Product lifecycle<small>State changes</small></button>
      </aside>
      <main>
        <button class="icon" id="sidebar-open" aria-label="Show navigation">☰</button>
        <div class="viewer"><iframe id="diagram" title="Architecture diagram" src="component/ecommerce-system.html"></iframe></div>
      </main>
    </div>
    <script>
      const app = document.querySelector("#app");
      const frame = document.querySelector("#diagram");
      const items = [...document.querySelectorAll(".nav-item")];
      const isNarrow = () => matchMedia("(max-width: 760px)").matches;

      document.querySelector("#sidebar-close").addEventListener("click", () => {
        if (isNarrow()) app.classList.remove("menu-open");
        else app.classList.add("collapsed");
      });
      document.querySelector("#sidebar-open").addEventListener("click", () => {
        if (isNarrow()) app.classList.add("menu-open");
        else app.classList.remove("collapsed");
      });
      document.querySelector("#theme-toggle").addEventListener("click", () => {
        document.documentElement.dataset.theme = document.documentElement.dataset.theme === "light" ? "dark" : "light";
      });
      items.forEach((item) => item.addEventListener("click", () => {
        frame.src = item.dataset.page;
        items.forEach((entry) => entry.classList.toggle("active", entry === item));
        app.classList.remove("menu-open");
      }));
    </script>
  </body>
</html>
